# CI vacation-planner на собственном раннере (docs/specs/07-environments-cicd.md).
# Сервер: тесты с postgres → Клиент: сборка → Deploy прод-стенда на этом сервере + smoke.
# Развёртывание: docker compose -p vacation-planner (том db-data сохраняется).
name: CI (сервер)

on:
  push:
    branches: [main, 'v0.*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Раннер выполняет шаги через bash, которого нет в alpine-образе deploy
defaults:
  run:
    shell: sh

jobs:
  server:
    name: 'Сервер: тесты (vitest + postgres)'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vacation
          POSTGRES_PASSWORD: vacation
          POSTGRES_DB: vacation_test
        options: >-
          --health-cmd "pg_isready -U vacation -d vacation_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://vacation:vacation@postgres:5432/vacation_test
      # vitest.config.ts читает TEST_DATABASE_URL (fallback — localhost, это для GitHub-раннеров
      # с published-портом сервиса; здесь сервис доступен по имени postgres)
      TEST_DATABASE_URL: postgresql://vacation:vacation@postgres:5432/vacation_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-32ch
    steps:
      - uses: actions/checkout@v4
      - name: Установка зависимостей
        run: npm ci
        working-directory: server
      - name: Prisma generate
        run: npx prisma generate
        working-directory: server
      - name: Миграции тестовой БД
        run: npx prisma migrate deploy
        working-directory: server
      - name: Сборка (tsc strict)
        run: npm run build
        working-directory: server
      - name: e2e-тесты (vitest + supertest)
        run: npm test
        working-directory: server
      - name: ESLint
        run: npm run lint
        working-directory: server

  web:
    name: 'Клиент: линтер, тесты, сборка'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установка зависимостей
        run: npm ci
        working-directory: web
      - name: ESLint
        run: npm run lint
        working-directory: web
      - name: 'Модульные тесты (vitest: lib/*)'
        run: npm test
        working-directory: web
      - name: Сборка (vue-tsc strict + vite)
        run: npm run build
        working-directory: web

  e2e:
    name: 'e2e интерфейса (Playwright, Chromium)'
    runs-on: ubuntu-latest
    needs: [server, web]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vacation
          POSTGRES_PASSWORD: vacation
          POSTGRES_DB: vacation
        options: >-
          --health-cmd "pg_isready -U vacation -d vacation"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://vacation:vacation@postgres:5432/vacation
      JWT_SECRET: e2e-secret-e2e-secret-e2e-secret-32
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: 'Сервер: зависимости, миграции, демо-данные, сборка'
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run db:seed
          npm run build
        working-directory: server
      - name: 'Клиент: зависимости и сборка'
        run: |
          npm ci
          npm run build
        working-directory: web
      - name: Браузер Chromium для Playwright
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: 'e2e: вход, график, заявка и согласование, команда, график работы'
        run: npm run e2e
        working-directory: web
      - name: Отчёт Playwright при падении
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14

  sbom:
    name: 'SBOM и лицензии (реестр ОП)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'Сервер: зависимости + SBOM'
        run: |
          npm ci
          npm run sbom
        working-directory: server
      - name: 'Клиент: зависимости + SBOM'
        run: |
          npm ci
          npm run sbom
        working-directory: web
      - name: 'Отчёт по лицензиям (падает при copyleft/unknown)'
        run: node scripts/license-report.mjs
      - name: Артефакты SBOM
        uses: actions/upload-artifact@v3
        with:
          name: sbom-cyclonedx
          path: sbom/*.cdx.json
          retention-days: 30

  deploy:
    name: 'Deploy прод-стенда + smoke'
    runs-on: deploy
    needs: [server, web, sbom, e2e]
    steps:
      - name: Docker CLI и compose
        run: apk add --no-cache docker-cli docker-cli-compose curl
      - name: Получить код (tarball из Gitea — в образе deploy нет node для actions/checkout)
        run: |
          curl -sfSL -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            "http://gitea:3000/${{ github.repository }}/archive/${{ github.sha }}.tar.gz" \
            | tar xz --strip-components=1
      - name: Сборка образов и развёртывание (проект vacation-planner)
        run: docker compose -p vacation-planner --profile full up -d --build
      - name: Smoke-пробы прод-стенда
        run: |
          # Шлюз сети job-контейнера = хост, где опубликованы порты стенда
          GW=$(ip route | awk '/default/ {print $3}')
          echo "Прод-стенд через шлюз $GW"
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://$GW/api/v1/employees 2>/dev/null || true)
            [ "$CODE" = "401" ] && break
            sleep 2
          done
          test "$CODE" = 401 || { echo 'API не поднялся за 120с'; docker compose -p vacation-planner logs server --tail 40; exit 1; }
          curl -fsS http://$GW/ | grep -qi '<!DOCTYPE html>'   # SPA отдаётся
          # nginx → server → PostgreSQL: вход с неверным паролем даёт 401 problem+json
          curl -s -o /tmp/probe.json -X POST http://$GW/api/v1/auth/login \
            -H 'Content-Type: application/json' -d '{"login":"probe","password":"wrong"}'
          grep -q 'auth/invalid-credentials' /tmp/probe.json
          # Метрики: внутри сети стенда отдаются, через nginx наружу — нет
          docker compose -p vacation-planner exec -T server sh -c 'wget -qO- --header "Authorization: Bearer $METRICS_TOKEN" http://127.0.0.1:8080/metrics' | grep -q '^vp_db_up 1'
          if curl -s http://$GW/metrics | grep -q 'vp_http_requests_total'; then
            echo 'Метрики доступны снаружи через nginx'; exit 1
          fi
          echo 'Дымовой прогон прод-стенда пройден'
