# Основной конфиг nginx стенда (v0.5.0): поток событий держит открытое соединение на каждую
# вкладку, а на сервер — ещё одно; 1024 соединений процесса по умолчанию хватает на ~500 вкладок.
user nginx;
worker_processes auto;
worker_rlimit_nofile 65536;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 16384;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Идентификатор запроса (v1.0.0): от прокси организации, если он его передал, иначе свой;
  # тот же идентификатор уходит в API и возвращается клиенту — строки nginx и API связываются
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    "" $request_id;
  }
  log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time rid=$req_id';
  access_log /var/log/nginx/access.log main;
  sendfile on;
  keepalive_timeout 65;
  include /etc/nginx/conf.d/*.conf;
}
