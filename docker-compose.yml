# Локальная разработка и стенд (docs/specs/07-environments-cicd.md).
# dev: docker compose up postgres && make seed   — сервер и фронт запускаются локально
# стенд: docker compose --profile full up        — всё в контейнерах за Nginx
# метрики: docker compose --profile full --profile monitoring up — плюс Prometheus на :9090
# реплика: docker compose -f docker-compose.yml -f docker-compose.replica.yml --profile full up
services:
  postgres:
    image: postgres:17-alpine
    # Все долгоживущие сервисы поднимаются после перезагрузки узла (v1.0.0)
    restart: unless-stopped
    environment:
      POSTGRES_USER: vacation
      # Пароль задаётся при первом запуске (создании тома); смена на работающей БД — руководство, «Настройка»
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vacation}
      POSTGRES_DB: vacation
    # Диагностика (v1.0.0, E51-05): медленные операторы — в журнал PostgreSQL, статистика
    # запросов — pg_stat_statements (deploy/postgres/top-queries.sql)
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=${PG_SLOW_MS:-1000}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacation -d vacation"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    profiles: ["full"]
    # Имя образа с версией: дистрибутив загружает готовые образы (docker load) и запускается без сборки
    image: vacation-planner-server:${VP_VERSION:-local}
    build:
      context: ./server
    restart: unless-stopped
    environment:
      # DB_HOST — адрес БД; при переключении на реплику: DB_HOST=postgres-replica (руководство по развёртыванию)
      DATABASE_URL: postgresql://vacation:${POSTGRES_PASSWORD:-vacation}@${DB_HOST:-postgres}:5432/vacation
      # Соединений с БД на процесс; пусто — min(10, 40 / процессов), не меньше 3
      DB_POOL_SIZE: ${DB_POOL_SIZE:-}
      # Каким прокси доверять при определении адреса клиента (лимит входа, журнал входов)
      TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}
      # Как часто процесс проверяет новые события для потока SSE, мс
      EVENTS_POLL_MS: ${EVENTS_POLL_MS:-2000}
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в .env — случайная строка не короче 32 символов}
      PORT: 8080
      NODE_ENV: production
      # Процессы API: auto — по числу ядер контейнера (01-architecture, «Масштабирование»)
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-auto}
      # Токен для /metrics (необязательно): порт API наружу не публикуется
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Журнал сервера (v1.0.0): JSON с идентификатором запроса; медленные запросы API и операции БД
      LOG_FORMAT: ${LOG_FORMAT:-json}
      REQUEST_LOG: ${REQUEST_LOG:-slow}
      SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-1000}
      SLOW_QUERY_MS: ${SLOW_QUERY_MS:-0}
      # Плановые задачи (извещения, эскалация, напоминания) — раз в столько секунд в каждом процессе (ADR-017)
      JOBS_POLL_SECONDS: ${JOBS_POLL_SECONDS:-60}
      # Почта (необязательно): без SMTP_HOST письма не отправляются, уведомления — только в интерфейсе
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Планировщик отпусков <noreply@localhost>}
      APP_URL: ${APP_URL:-http://localhost}
      # Единый вход (необязательно): OpenID Connect — Keycloak, ADFS, Blitz Identity и др.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_LOGIN_CLAIM: ${OIDC_LOGIN_CLAIM:-preferred_username}
      OIDC_LABEL: ${OIDC_LABEL:-корпоративную учётную запись}
      LOCAL_LOGIN: ${LOCAL_LOGIN:-true}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["full"]
    image: vacation-planner-web:${VP_VERSION:-local}
    build:
      context: ./web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

  # Резервные копии: pg_dump раз в BACKUP_INTERVAL секунд (по умолчанию сутки), хранение BACKUP_KEEP_DAYS дней.
  # Восстановление — docs/manuals/deployment-guide.md, раздел «Резервное копирование».
  backup:
    profiles: ["full"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: ${DB_HOST:-postgres}
      PGUSER: vacation
      PGPASSWORD: ${POSTGRES_PASSWORD:-vacation}
      PGDATABASE: vacation
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/vacation-$$(date +%Y%m%d-%H%M%S).dump
          if pg_dump -Fc -f "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "backup: $$f"; else rm -f "$$f.tmp"; echo "backup: ОШИБКА"; fi
          find /backups -name 'vacation-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep "$$BACKUP_INTERVAL"
        done
    volumes:
      - db-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # Метрики (E40-01): сбор /metrics сервера и правила оповещений. Панель Grafana —
  # deploy/monitoring/grafana-dashboard.json, импортируется в Grafana организации.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

volumes:
  db-data:
  db-backups:
  prometheus-data:
