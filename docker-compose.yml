# Локальная разработка и стенд (docs/specs/07-environments-cicd.md).
# dev: docker compose up postgres && make seed   — сервер и фронт запускаются локально
# стенд: docker compose --profile full up        — всё в контейнерах за Nginx
# метрики: docker compose --profile full --profile monitoring up — плюс Prometheus на :9090
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vacation
      POSTGRES_PASSWORD: vacation
      POSTGRES_DB: vacation
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacation -d vacation"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    profiles: ["full"]
    build:
      context: ./server
    environment:
      DATABASE_URL: postgresql://vacation:vacation@postgres:5432/vacation
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-dev-only-secret-32ch}
      PORT: 8080
      NODE_ENV: production
      # Процессы API: auto — по числу ядер контейнера (01-architecture, «Масштабирование»)
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-auto}
      # Токен для /metrics (необязательно): порт API наружу не публикуется
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Почта (необязательно): без SMTP_HOST письма не отправляются, уведомления — только в интерфейсе
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Планировщик отпусков <noreply@localhost>}
      APP_URL: ${APP_URL:-http://localhost}
      # Единый вход (необязательно): OpenID Connect — Keycloak, ADFS, Blitz Identity и др.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_LOGIN_CLAIM: ${OIDC_LOGIN_CLAIM:-preferred_username}
      OIDC_LABEL: ${OIDC_LABEL:-корпоративную учётную запись}
      LOCAL_LOGIN: ${LOCAL_LOGIN:-true}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: ./web
    ports:
      - "80:80"
    depends_on:
      - server

  # Резервные копии: pg_dump раз в BACKUP_INTERVAL секунд (по умолчанию сутки), хранение BACKUP_KEEP_DAYS дней.
  # Восстановление — docs/manuals/deployment-guide.md, раздел «Резервное копирование».
  backup:
    profiles: ["full"]
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: vacation
      PGPASSWORD: vacation
      PGDATABASE: vacation
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/vacation-$$(date +%Y%m%d-%H%M%S).dump
          if pg_dump -Fc -f "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "backup: $$f"; else rm -f "$$f.tmp"; echo "backup: ОШИБКА"; fi
          find /backups -name 'vacation-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep "$$BACKUP_INTERVAL"
        done
    volumes:
      - db-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # Метрики (E40-01): сбор /metrics сервера и правила оповещений. Панель Grafana —
  # deploy/monitoring/grafana-dashboard.json, импортируется в Grafana организации.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

volumes:
  db-data:
  db-backups:
  prometheus-data:
