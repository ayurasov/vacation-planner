# Конвейер CI монорепо: server, web, SBOM, docker, дым полного стенда.
# Окружения и порядок выпуска — docs/specs/07-environments-cicd.md.
name: CI (GitHub)

on:
  push:
    branches: [main, 'v0.*']
  pull_request:
    branches: [main, 'v0.*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    if: github.server_url == 'https://github.com'   # на Gitea-сервере работает .gitea/workflows/ci.yml
    name: 'Сервер: сборка + e2e (Node ${{ matrix.node }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vacation
          POSTGRES_PASSWORD: vacation
          POSTGRES_DB: vacation_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vacation -d vacation_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://vacation:vacation@localhost:5432/vacation_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-32ch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm, cache-dependency-path: server/package-lock.json }
      - name: Установка зависимостей
        run: npm ci
        working-directory: server
      - name: Prisma generate
        run: npx prisma generate
        working-directory: server
      - name: Миграции тестовой БД
        run: npx prisma migrate deploy
        working-directory: server
      - name: Сборка (tsc strict)
        run: npm run build
        working-directory: server
      - name: e2e-тесты (vitest + supertest)
        run: npm test
        working-directory: server
      - name: ESLint
        run: npm run lint
        working-directory: server

  web:
    if: github.server_url == 'https://github.com'   # на Gitea-сервере работает .gitea/workflows/ci.yml
    name: 'Клиент: сборка (vue-tsc + vite)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run lint
        working-directory: web

  sbom:
    if: github.server_url == 'https://github.com'   # на Gitea-сервере работает .gitea/workflows/ci.yml
    name: 'SBOM и лицензии (реестр ОП)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: server/package-lock.json }
      - name: 'Сервер: зависимости + SBOM'
        run: |
          npm ci
          npm run sbom
        working-directory: server
      - name: 'Клиент: зависимости + SBOM'
        run: |
          npm ci
          npm run sbom
        working-directory: web
      - name: Отчёт по лицензиям (падает при copyleft/unknown)
        run: node scripts/license-report.mjs
      - name: Загрузка артефактов SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom/*.cdx.json
          retention-days: 30

  docker:
    if: github.server_url == 'https://github.com'   # на Gitea-сервере работает .gitea/workflows/ci.yml
    name: Docker-образы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка server и web
        run: docker compose --profile full build

  smoke:
    if: github.server_url == 'https://github.com'   # на Gitea-сервере работает .gitea/workflows/ci.yml
    name: Дымовой прогон полного стенда
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка и запуск (postgres + server + web/nginx)
        run: docker compose --profile full up -d --build
        env:
          JWT_SECRET: smoke-secret-smoke-secret-smoke-32ch
      - name: Пробы стенда
        run: |
          # Ждём готовности API (server применяет миграции при старте — nginx отвечает раньше)
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:80/api/v1/employees 2>/dev/null)
            [ "$CODE" = "401" ] && break
            sleep 2
          done
          test "$CODE" = 401 || { echo 'API не поднялся за 120с'; docker compose logs server --tail 40; exit 1; }
          curl -fsS http://127.0.0.1:80/ | grep -qi '<!DOCTYPE html>'   # SPA отдаётся
          # nginx → server → PostgreSQL: вход с неверным паролём даёт 401 problem+json
          curl -s -o /tmp/probe.json -X POST http://127.0.0.1:80/api/v1/auth/login \
            -H 'Content-Type: application/json' -d '{"login":"probe","password":"wrong"}'
          grep -q 'auth/invalid-credentials' /tmp/probe.json
          echo 'Дымовой прогон стенда пройден'
