# Конвейер CI монорепо: server, web, SBOM, docker, дым полного стенда.
# Окружения и порядок выпуска — docs/specs/07-environments-cicd.md.
name: CI (GitHub)

on:
  push:
    branches: [main, 'v0.*']
  pull_request:
    branches: [main, 'v0.*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    if: github.server_url == 'https://github.com'   # на Gitea-сервере работает .gitea/workflows/ci.yml
    name: 'Сервер: сборка + e2e (Node ${{ matrix.node }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vacation
          POSTGRES_PASSWORD: vacation
          POSTGRES_DB: vacation_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vacation -d vacation_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://vacation:vacation@localhost:5432/vacation_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-32ch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm, cache-dependency-path: server/package-lock.json }
      - name: Установка зависимостей
        run: npm ci
        working-directory: server
      - name: Prisma generate
        run: npx prisma generate
        working-directory: server
      - name: Миграции тестовой БД
        run: npx prisma migrate deploy
        working-directory: server
      - name: Сборка (tsc strict)
        run: npm run build
        working-directory: server
      - name: e2e-тесты (vitest + supertest)
        run: npm test
        working-directory: server
      - name: ESLint
        run: npm run lint
        working-directory: server

  web:
    if: github.server_url == 'https://github.com'   # на Gitea-сервере работает .gitea/workflows/ci.yml
    name: 'Клиент: линтер, тесты, сборка'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Установка зависимостей
        run: npm ci
        working-directory: web
      - name: ESLint
        run: npm run lint
        working-directory: web
      - name: 'Модульные тесты (vitest: lib/*)'
        run: npm test
        working-directory: web
      - name: Сборка (vue-tsc strict + vite)
        run: npm run build
        working-directory: web

  e2e:
    if: github.server_url == 'https://github.com'   # на Gitea-сервере работает .gitea/workflows/server-ci.yml
    name: 'e2e интерфейса (Playwright, Chromium)'
    runs-on: ubuntu-latest
    needs: [server, web]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vacation
          POSTGRES_PASSWORD: vacation
          POSTGRES_DB: vacation
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vacation -d vacation"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://vacation:vacation@localhost:5432/vacation
      JWT_SECRET: e2e-secret-e2e-secret-e2e-secret-32
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: 'Сервер: зависимости, миграции, демо-данные, сборка'
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run db:seed
          npm run build
        working-directory: server
      - name: 'Клиент: зависимости и сборка'
        run: |
          npm ci
          npm run build
        working-directory: web
      - name: Браузер Chromium для Playwright
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: 'e2e: вход, график, заявка и согласование, команда, график работы'
        run: npm run e2e
        working-directory: web
      - name: Отчёт Playwright при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14

  sbom:
    if: github.server_url == 'https://github.com'   # на Gitea-сервере работает .gitea/workflows/ci.yml
    name: 'SBOM и лицензии (реестр ОП)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: server/package-lock.json }
      - name: 'Сервер: зависимости + SBOM'
        run: |
          npm ci
          npm run sbom
        working-directory: server
      - name: 'Клиент: зависимости + SBOM'
        run: |
          npm ci
          npm run sbom
        working-directory: web
      - name: Отчёт по лицензиям (падает при copyleft/unknown)
        run: node scripts/license-report.mjs
      - name: Загрузка артефактов SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom/*.cdx.json
          retention-days: 30

  docker:
    if: github.server_url == 'https://github.com'   # на Gitea-сервере работает .gitea/workflows/ci.yml
    name: Docker-образы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка server и web
        run: docker compose --profile full build

  smoke:
    if: github.server_url == 'https://github.com'   # на Gitea-сервере работает .gitea/workflows/ci.yml
    name: Дымовой прогон полного стенда
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка и запуск (postgres + server + web/nginx)
        run: docker compose --profile full up -d --build
        env:
          JWT_SECRET: smoke-secret-smoke-secret-smoke-32ch
      - name: Пробы стенда
        run: |
          # Ждём готовности API (server применяет миграции при старте — nginx отвечает раньше)
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:80/api/v1/employees 2>/dev/null || true)
            [ "$CODE" = "401" ] && break
            sleep 2
          done
          test "$CODE" = 401 || { echo 'API не поднялся за 120с'; docker compose logs server --tail 40; exit 1; }
          curl -fsS http://127.0.0.1:80/ | grep -qi '<!DOCTYPE html>'   # SPA отдаётся
          # nginx → server → PostgreSQL: вход с неверным паролём даёт 401 problem+json
          curl -s -o /tmp/probe.json -X POST http://127.0.0.1:80/api/v1/auth/login \
            -H 'Content-Type: application/json' -d '{"login":"probe","password":"wrong"}'
          grep -q 'auth/invalid-credentials' /tmp/probe.json
          # Метрики: внутри сети стенда отдаются (сложены по всем процессам), через nginx — нет
          docker compose exec -T server sh -c 'wget -qO- --header "Authorization: Bearer $METRICS_TOKEN" http://127.0.0.1:8080/metrics' > /tmp/metrics.txt
          grep -q '^vp_db_up 1' /tmp/metrics.txt
          grep -q '^vp_process_count [1-9]' /tmp/metrics.txt
          if curl -s http://127.0.0.1:80/metrics | grep -q 'vp_http_requests_total'; then
            echo 'Метрики доступны снаружи через nginx'; exit 1
          fi
          # Живые обновления через nginx: первое событие приходит сразу — поток не буферизуется
          docker compose exec -T server npm run db:seed:prod > /dev/null
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:80/api/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"login":"yurasov.av","password":"j2ENXpPi"}' | jq -r .accessToken)
          TICKET=$(curl -fsS -X POST http://127.0.0.1:80/api/v1/events/ticket -H "Authorization: Bearer $TOKEN" | jq -r .ticket)
          curl -sN --max-time 3 "http://127.0.0.1:80/api/v1/events?ticket=$TICKET" > /tmp/sse.txt || true
          grep -q '^event: hello' /tmp/sse.txt || { echo 'SSE через nginx не пришёл'; cat /tmp/sse.txt; exit 1; }
          echo 'Дымовой прогон стенда пройден'
