openapi: 3.1.0
info:
  title: Vacation Planner API
  version: 1.0.0
  summary: Корпоративный планировщик отпусков — публичный контракт API v1
  description: |
    Целевой контракт этапа 1 (см. docs/specs/01-architecture.md, docs/specs/02-api-spec.md).
    Заменяет протокол этапа 0 (GET/PUT /api/state целиком) гранулярными ресурсами.

    Правила совместимости: только добавляющие изменения; поля не удаляются и не
    переименовываются; неизвестные поля клиент обязан игнорировать.

    Ошибки — RFC 9457 (application/problem+json) с кодом из каталога
    docs/specs/02-api-spec.md, раздел «Каталог ошибок».

    Любая операция при перегрузке или недоступности БД отвечает 503 service-unavailable
    с заголовком Retry-After (секунд); 429 rate-limited тоже несёт Retry-After.
  license:
    name: Internal
  contact:
    name: Владелец сервиса
servers:
  - url: /api/v1
    description: Относительный путь — тот же хост, что и веб-интерфейс

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Аутентификация и сессия
  - name: employees
    description: Сотрудники и профили
  - name: vacation-requests
    description: Заявки на отпуск и их жизненный цикл
  - name: schedule
    description: График отпусков и режимы работы
  - name: balance
    description: Балансы дней отпуска
  - name: directories
    description: 'Справочники: отделы, проекты, группы'
  - name: settings
    description: Настройки организации
  - name: calendar
    description: Производственный календарь
  - name: notifications
    description: Уведомления пользователя
  - name: audit
    description: Журнал изменений (только чтение)
  - name: reports
    description: Выгрузки и отчёты
  - name: imports
    description: Импорт сотрудников и остатков (кадровая служба, администратор)
  - name: events
    description: Поток событий сервера (SSE) — живые обновления без опроса

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вход по логину и паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string, minLength: 1, maxLength: 64 }
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Сессия создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
    x-rate-limit: 10 запросов в минуту с одного адреса

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Новый access-токен по refresh-cookie (ротация; старый refresh отзывается)
      security: []
      responses:
        '200':
          description: Новая пара — access в теле, refresh в httpOnly-cookie vp_refresh
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Problem' }

  /auth/password:
    post:
      tags: [auth]
      operationId: changeOwnPassword
      summary: Смена своего пароля (все сессии завершаются)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string }
                newPassword: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '204': { description: Пароль изменён }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Завершить сессию
      responses:
        '204': { description: Сессия завершена }
        '401': { $ref: '#/components/responses/Problem' }

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Текущий пользователь и его права
      responses:
        '200':
          description: Профиль и вычисленные права
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [auth]
      operationId: updateMyPreferences
      summary: Личные настройки — письма о заявках
      description: Отписка действует и на письма о заявках, и на еженедельную сводку; изменение пишется в аудит.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emailNotifications]
              properties:
                emailNotifications: { type: boolean }
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Problem' }

  /auth/oidc/config:
    get:
      tags: [auth]
      operationId: getSsoConfig
      summary: Единый вход — включён ли, подпись кнопки, разрешён ли вход по паролю
      security: []
      responses:
        '200':
          description: Настройки экрана входа
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  label: { type: string, description: 'Подпись: «Войти через …»' }
                  localLogin: { type: boolean, description: 'false — пароль только у администраторов (LOCAL_LOGIN=false)' }

  /auth/oidc/start:
    get:
      tags: [auth]
      operationId: startSso
      summary: Начать вход через провайдер OpenID Connect
      description: Authorization code + PKCE (S256); state, nonce и verifier — в подписанной httpOnly-cookie на 10 минут.
      security: []
      responses:
        '302': { description: 'Перенаправление на страницу входа провайдера или на /login?sso=disabled|unavailable' }

  /auth/oidc/callback:
    get:
      tags: [auth]
      operationId: ssoCallback
      summary: Возврат от провайдера
      description: |
        Код меняется на токены, id_token проверяется (подпись по JWKS, issuer, audience, срок, nonce),
        сотрудник ищется по логину из утверждения OIDC_LOGIN_CLAIM. Успех — refresh-cookie и 302 на /schedule;
        отказ — 302 на /login?sso=cancelled|expired|invalid|unknown.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302': { description: В приложение или на экран входа с кодом причины }

  /employees:
    get:
      tags: [employees]
      operationId: listEmployees
      summary: Список сотрудников (постранично, с фильтрами)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: dept, in: query, schema: { type: string }, description: Отдел (точное имя) }
        - { name: project, in: query, schema: { type: integer }, description: Идентификатор проекта }
        - { name: search, in: query, schema: { type: string, maxLength: 100 }, description: Поиск по ФИО/должности }
        - { name: manager, in: query, schema: { type: integer }, description: 'Только прямые подчинённые сотрудника с этим идентификатором (с v0.5.0)' }
      responses:
        '200':
          description: Страница сотрудников
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeePage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [employees]
      operationId: createEmployee
      summary: Создать сотрудника (только администратор)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeCreate' }
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /employees/{id}:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    get:
      tags: [employees]
      operationId: getEmployee
      summary: Карточка сотрудника
      responses:
        '200':
          description: Сотрудник
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [employees]
      operationId: updateEmployee
      summary: Изменить поля сотрудника
      description: 'Частичное обновление. Пароль через /employees/{id}/password.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeUpdate' }
      responses:
        '200':
          description: Обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [employees]
      operationId: deleteEmployee
      summary: Уволить/удалить сотрудника (только администратор)
      description: Нельзя удалить последнего администратора.
      responses:
        '204': { description: Удалён }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /employees/{id}/password:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    put:
      tags: [employees]
      operationId: changePassword
      summary: Смена пароля (свой — со старым, чужой — только администратор)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                oldPassword: { type: string, description: Обязателен при смене своего пароля }
                newPassword: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '204': { description: Пароль изменён }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /employees/{id}/balance:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    get:
      tags: [balance]
      operationId: getBalance
      summary: Баланс дней отпуска за год
      parameters:
        - { name: year, in: query, schema: { type: integer, minimum: 2024, maximum: 2100 } }
      responses:
        '200':
          description: Баланс
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /employees/{id}/work-pattern:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    put:
      tags: [schedule]
      operationId: setWorkPattern
      summary: Недельный шаблон офис/удалёнка (свой или подчинённый)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkPattern' }
      responses:
        '204': { description: Шаблон сохранён }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /employees/{id}/work-overrides:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    put:
      tags: [schedule]
      operationId: setWorkOverride
      summary: Ручное переопределение режима на дату
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, mode]
              properties:
                date: { type: string, format: date }
                mode: { type: string, enum: [office, remote, off] }
      responses:
        '204': { description: Переопределение сохранено }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /employees/{id}/work-schedule:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    get:
      tags: [schedule]
      operationId: getWorkSchedule
      summary: График работы — недельный шаблон и исключения за период (с v0.3.0)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Шаблон по дням недели (0 — вс) и исключения по датам
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: { type: integer }
                  pattern: { type: object, additionalProperties: { type: string, enum: [office, remote, off] } }
                  overrides:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        mode: { type: string, enum: [office, remote, off] }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /employees/{id}/work-overrides/{date}:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
      - { name: date, in: path, required: true, schema: { type: string, format: date } }
    delete:
      tags: [schedule]
      operationId: deleteWorkOverride
      summary: Снять исключение — на дату снова действует недельный шаблон (с v0.3.0)
      responses:
        '204': { description: Исключение снято }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /vacation-requests:
    get:
      tags: [vacation-requests]
      operationId: listVacationRequests
      summary: Заявки (свои, подчинённых или все — по правам)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: scope, in: query, schema: { type: string, enum: [mine, subordinates, all], default: mine } }
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, cancelled] } }
        - { name: employee, in: query, schema: { type: integer }, description: Идентификатор сотрудника }
      responses:
        '200':
          description: Страница заявок
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacationRequestPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [vacation-requests]
      operationId: createVacationRequest
      summary: Создать заявку (за себя или за подчинённого)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VacationRequestCreate' }
      responses:
        '201':
          description: Создана; для администратора/руководителя за подчинённого — сразу approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacationRequest' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: Пересечение с существующей заявкой того же сотрудника
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vacation-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [vacation-requests]
      operationId: getVacationRequest
      summary: Заявка с историей
      responses:
        '200':
          description: Заявка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacationRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [vacation-requests]
      operationId: updateVacationRequest
      summary: Изменить свою pending-заявку или запросить перенос approved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                start: { type: string, format: date }
                end: { type: string, format: date }
                comment: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Обновлена (approved-заявка возвращается в pending с признаком переноса)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacationRequest' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [vacation-requests]
      operationId: cancelVacationRequest
      summary: Отменить свою pending-заявку или запросить удаление approved
      responses:
        '204': { description: Отменена / поставлена на удаление }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /vacation-requests/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [vacation-requests]
      operationId: approveVacationRequest
      summary: Согласовать (руководитель сотрудника или администратор)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Согласована
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacationRequest' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /vacation-requests/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [vacation-requests]
      operationId: rejectVacationRequest
      summary: Отклонить с обязательным комментарием
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '200':
          description: Отклонена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VacationRequest' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /schedule:
    get:
      tags: [schedule]
      operationId: getSchedule
      summary: График отпусков и режимов за период
      description: Данные для Gantt-представления; сервер отдаёт компактные интервалы, клиент рендерит. Ответ кэшируется по версии данных (ETag, Cache-Control private, no-cache); If-None-Match с текущим ETag — 304 без тела.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: dept, in: query, schema: { type: string } }
        - { name: project, in: query, schema: { type: integer } }
        - { name: group, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Интервалы по сотрудникам
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }

  /departments:
    get:
      tags: [directories]
      operationId: listDepartments
      summary: Отделы с руководителями и численностью
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Department' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [directories]
      operationId: createDepartment
      summary: Создать отдел (администратор)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 128 }
                managerId: { type: [integer, 'null'] }
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /departments/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    patch:
      tags: [directories]
      operationId: updateDepartment
      summary: Переименовать, сменить руководителя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 128 }
                managerId: { type: [integer, 'null'] }
      responses:
        '200':
          description: Обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [directories]
      operationId: deleteDepartment
      summary: Удалить отдел (нельзя при наличии сотрудников)
      responses:
        '204': { description: Удалён }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /projects:
    get:
      tags: [directories]
      operationId: listProjects
      summary: Проекты
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [directories]
      operationId: createProject
      summary: Создать проект (администратор)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 128 }
                managerId: { type: [integer, 'null'] }
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /projects/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [directories]
      operationId: updateProject
      summary: Изменить проект
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 128 }
                managerId: { type: [integer, 'null'] }
      responses:
        '200':
          description: Обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [directories]
      operationId: deleteProject
      summary: Удалить проект (нельзя при наличии участников)
      responses:
        '204': { description: Удалён }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /groups:
    get:
      tags: [directories]
      operationId: listGroups
      summary: Пользовательские группы для фильтров
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [directories]
      operationId: createGroup
      summary: Создать группу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 128 }
                members: { type: array, items: { type: integer } }
      responses:
        '201':
          description: Создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Problem' }

  /groups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [directories]
      operationId: updateGroup
      summary: Изменить название или состав
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 128 }
                members: { type: array, items: { type: integer } }
      responses:
        '200':
          description: Обновлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [directories]
      operationId: deleteGroup
      summary: Удалить группу
      responses:
        '204': { description: Удалена }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Настройки организации
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgSettings' }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [settings]
      operationId: updateSettings
      summary: Изменить настройки (только администратор)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrgSettingsUpdate' }
      responses:
        '200':
          description: Обновлены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgSettings' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }


  /settings/test-email:
    post:
      tags: [settings]
      operationId: sendTestEmail
      summary: Проверочное письмо администратору (проверка SMTP после развёртывания)
      description: Письмо ставится в очередь и сразу отправляется на email администратора; ответ сообщает результат.
      responses:
        '200':
          description: Результат отправки
          content:
            application/json:
              schema:
                type: object
                properties:
                  to: { type: string, format: email }
                  sent: { type: boolean }
                  error: { type: [string, 'null'], description: Ответ SMTP-сервера при неудаче }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /calendar/holidays/{year}:
    get:
      tags: [calendar]
      operationId: getHolidays
      summary: Праздники и переносы производственного календаря
      security: []
      parameters:
        - { name: year, in: path, required: true, schema: { type: integer, minimum: 2024, maximum: 2100 } }
      responses:
        '200':
          description: Календарь на год
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionCalendar' }
        '400': { $ref: '#/components/responses/Problem' }
    put:
      tags: [calendar]
      operationId: setHolidays
      summary: Загрузить или изменить календарь года (кадровая служба, администратор)
      description: Даты сортируются, повторы убираются; праздники — только этого года. Изменение пишется в аудит (calendar.created / calendar.updated).
      parameters:
        - { name: year, in: path, required: true, schema: { type: integer, minimum: 2024, maximum: 2100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holidays, transfers]
              properties:
                holidays: { type: array, maxItems: 60, items: { type: string, format: date } }
                transfers:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    required: [from, to]
                    properties:
                      from: { type: string, format: date, description: Выходной, который становится рабочим }
                      to: { type: string, format: date, description: Рабочий день, который становится выходным }
      responses:
        '200':
          description: Сохранённый календарь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionCalendar' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: Уведомления текущего пользователя
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: unread, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Страница уведомлений
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '401': { $ref: '#/components/responses/Problem' }

  /notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: Пометить прочитанными все уведомления (с v0.5.0)
      responses:
        '200':
          description: Сколько уведомлений отмечено
          content:
            application/json:
              schema: { type: object, properties: { marked: { type: integer } } }
        '401': { $ref: '#/components/responses/Problem' }

  /notifications/{id}/read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Пометить прочитанным
      responses:
        '204': { description: Прочитано }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: Журнал изменений (администратор)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: employee, in: query, schema: { type: integer } }
        - { name: entity, in: query, schema: { type: string } }
      responses:
        '200':
          description: Страница событий
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /imports/employees:
    post:
      tags: [imports]
      operationId: importEmployees
      summary: Импорт сотрудников и остатков — предпросмотр или применение
      description: |
        Файл XLSX/CSV (multipart, поле `file`, до 2 МБ) или JSON `{ rows }` для синхронизации с кадровой системой.
        Строка сопоставляется с сотрудником по логину, без логина — по ФИО; новый сотрудник получает логин транслитом.
        Пустая ячейка значение не меняет; повторная загрузка того же файла ничего не меняет.
        `dryRun=true` (по умолчанию) — только план; `dryRun=false` — применение одной транзакцией с аудитом,
        только если в плане нет ошибок. Пароли созданных возвращаются один раз.
      parameters:
        - { name: dryRun, in: query, schema: { type: boolean, default: true } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  maxItems: 5000
                  items: { $ref: '#/components/schemas/ImportRowInput' }
      responses:
        '200':
          description: План импорта; при dryRun=false — применённый
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /imports/employees/template:
    get:
      tags: [imports]
      operationId: getImportTemplate
      summary: Шаблон XLSX для импорта сотрудников
      responses:
        '200':
          description: Книга XLSX с листами «Сотрудники» и «Пояснения»
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Problem' }

  /events/ticket:
    post:
      tags: [events]
      operationId: getEventsTicket
      summary: Билет на поток событий (60 секунд)
      description: EventSource не передаёт заголовок Authorization, а access-токен в адресе попал бы в журналы прокси, поэтому поток открывается по короткому билету.
      responses:
        '200':
          description: Билет
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { type: string }
        '401': { $ref: '#/components/responses/Problem' }

  /events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Поток событий (text/event-stream)
      description: |
        События: `hello` { unread, version } при подключении; `notifications` { unread } — новые уведомления
        пользователя; `data` { version } — данные графика изменились (не чаще раза в 15 секунд).
        Комментарий-пинг каждые 25 секунд. При обрыве клиент получает новый билет и переподключается;
        пока потока нет — опрашивает уведомления раз в 30 секунд.
      security: []
      parameters:
        - { name: ticket, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Поток событий
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Problem' }

  /reports/vacations:
    get:
      tags: [reports]
      operationId: exportVacations
      summary: Выгрузка отпусков за период (XLSX)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: XLSX-файл
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /analytics/departments:
    get:
      tags: [analytics]
      operationId: listAnalyticsDepartments
      summary: Отделы, доступные пользователю для аналитики (с v0.3.0)
      responses:
        '200':
          description: Администратор — все, руководитель — свои, сотрудник — собственный
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: string } }
                  own: { type: [string, 'null'] }

  /analytics/overview:
    get:
      tags: [analytics]
      operationId: getDepartmentOverview
      summary: Нагрузка отдела по месяцам, периоды конфликтов, распределение дней, выводы (с v0.3.0)
      parameters:
        - { name: dept, in: query, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Аналитика года
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentOverview' }
        '403': { $ref: '#/components/responses/Problem' }

  /analytics/team:
    get:
      tags: [analytics]
      operationId: getTeamToday
      summary: Состав отдела или проекта на дату — офис, удалёнка, отпуск, выходной (с v0.3.0)
      parameters:
        - { name: dept, in: query, schema: { type: string } }
        - { name: project, in: query, schema: { type: integer } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Сводка и участники со статусом на дату
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamSnapshot' }
        '403': { $ref: '#/components/responses/Problem' }

  /analytics/suggestions:
    get:
      tags: [analytics]
      operationId: suggestVacationDates
      summary: Лучшие окна для отпуска с учётом нагрузки отдела и праздников (с v0.3.0)
      parameters:
        - { name: days, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 60 } }
        - { name: employee, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: До 5 непересекающихся окон, лучшие первыми
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suggestions' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-токен, срок жизни 15 минут; обновление — refresh-токен в httpOnly cookie.

  parameters:
    EmployeeId:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: Идентификатор сотрудника
    RequestId:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: Идентификатор заявки
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    DepartmentOverview:
      type: object
      properties:
        dept: { type: string }
        year: { type: integer }
        threshold: { type: number }
        headcount: { type: integer }
        months:
          type: array
          items:
            type: object
            properties:
              month: { type: integer }
              avgRatio: { type: number, description: 'Средняя доля в согласованном отпуске по рабочим дням' }
              planRatio: { type: number, description: 'То же с учётом заявок на согласовании' }
              peakRatio: { type: number }
              peakDate: { type: [string, 'null'], format: date }
        conflicts:
          type: array
          items:
            type: object
            properties:
              start: { type: string, format: date }
              end: { type: string, format: date }
              peakRatio: { type: number }
              peakAbsent: { type: integer }
              names: { type: array, items: { type: string } }
        planning:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              available: { type: number }
              planned: { type: number }
              hasStretch: { type: boolean }
        insights:
          type: array
          items: { $ref: '#/components/schemas/Insight' }

    Insight:
      type: object
      properties:
        severity: { type: string, enum: [danger, warning, info, success] }
        title: { type: string }
        text: { type: string }

    TeamSnapshot:
      type: object
      properties:
        date: { type: string, format: date }
        threshold: { type: number }
        headcount: { type: integer }
        absentRatio: { type: number }
        overThreshold: { type: boolean }
        counts:
          type: object
          properties:
            office: { type: integer }
            remote: { type: integer }
            vacation: { type: integer }
            off: { type: integer }
            pending: { type: integer }
        members:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              dept: { type: [string, 'null'] }
              status: { type: string, enum: [vacation, office, remote, off] }
              until: { type: [string, 'null'], format: date }
              next: { type: [object, 'null'] }
              available: { type: number }
              hasStretch: { type: boolean }
              pending: { type: integer }

    Suggestions:
      type: object
      properties:
        employee: { type: integer }
        length: { type: integer }
        available: { type: number }
        hasStretch: { type: boolean }
        threshold: { type: number }
        items:
          type: array
          items:
            type: object
            properties:
              start: { type: string, format: date }
              end: { type: string, format: date }
              vacationDays: { type: integer }
              calendarDays: { type: integer }
              holidays: { type: integer }
              maxRatio: { type: number }
              avgRatio: { type: number }
              overlapWith: { type: array, items: { type: string } }
              score: { type: number }
              reasons: { type: array, items: { type: string } }

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, description: 'Код ошибки из каталога, например https://vacation.planner/problems/overlapping-request' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

    Session:
      type: object
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/Me' }

    Me:
      type: object
      properties:
        employee: { $ref: '#/components/schemas/Employee' }
        permissions:
          type: object
          properties:
            approveSubordinates: { type: array, items: { type: integer }, description: Идентификаторы подчинённых }
            isAdmin: { type: boolean }
            isHr: { type: boolean, description: Кадровая служба }
            manageStaff: { type: boolean, description: 'Сотрудники, импорт, календарь, выгрузки, аудит (администратор или кадровая служба)' }
            manageDirectories: { type: boolean }
            manageSettings: { type: boolean, description: Настройки организации — только администратор }

    Employee:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: [string, 'null'], format: email }
        emailNotifications: { type: boolean, description: 'Письма о заявках и сводки (в ответе /auth/me)' }
        position: { type: [string, 'null'] }
        deptId: { type: [integer, 'null'] }
        deptName: { type: [string, 'null'] }
        role: { type: string, enum: [employee, manager] }
        isAdmin: { type: boolean }
        isHr: { type: boolean, description: Кадровая служба }
        empType: { type: string, enum: [staff, ipsz], description: 'ipsz — ИП/самозанятый, отпуск не предусмотрен' }
        managerId: { type: [integer, 'null'] }
        projectId: { type: [integer, 'null'] }
        login: { type: string }
        plannedDays: { type: number, minimum: 0 }
        carryOver: { type: number, minimum: 0 }
        isActive: { type: boolean }

    EmployeeCreate:
      type: object
      required: [name]
